services:
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    ports:
      - "5305:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

  web:
    build:
      context: .
      dockerfile: Web/Dockerfile
    ports:
      - "5300:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MessagesApi__BaseUrl: http://api:8080
    depends_on:
      - api
